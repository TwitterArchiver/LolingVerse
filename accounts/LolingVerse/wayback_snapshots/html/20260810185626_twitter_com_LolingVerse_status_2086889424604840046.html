  <div class="tweet-content">
  不知道胶囊到底是不是个好的审美，但是先用好了：
  <br/>
  <br/>
  如果你说的是现在很多 App 用的那种**“底部悬浮胶囊导航”**——不是传统整条 BottomNavigationBar，而是内容铺满全屏，底部放一个圆角胶囊，里面几个图标/文字——它的核心其实是：
  <br/>
  Edge-to-edge 内容层 + 悬浮导航层 + 系统手势区 inset。
  <br/>
  现在 Android 15/16 已经强制/默认大量采用 edge-to-edge：App 内容可以一直绘制到屏幕底部，系统手势导航本身则是透明的。
